# Same pull-request check as .github/workflows/ci.yml, for Azure DevOps.
# Use this file if the repository is hosted in Azure Repos.
trigger:
  branches:
    include: [main]

pr:
  branches:
    include: ["*"]

pool:
  vmImage: ubuntu-latest

variables:
  DBT_PROFILES_DIR: .
  DBT_TARGET: dev
  DUCKDB_PATH: ci.duckdb

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"

  - script: pip install "dbt-core>=1.10,<2.0" "dbt-duckdb>=1.10,<2.0" duckdb
    displayName: Install dependencies

  - script: bash scripts/load_fixtures.sh
    displayName: Load fixture data

  - script: dbt build
    displayName: dbt build

  - script: dbt docs generate --static
    displayName: Generate documentation

  - publish: target/static_index.html
    artifact: dbt-docs
    displayName: Publish docs
